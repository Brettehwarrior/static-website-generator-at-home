  - "Chuck Norris is the ghost in Paranormal Activity, when the guy went flying at the end, it was because Chuck Norris roundhouse kicked him Chuck Norris counted to infinity - twice. What was going through the minds of all of Chuck Norris' victims before they died? His shoe Chuck Norris invented Kentucky Fried Chicken's famous secret recipe, with eleven herbs and spices. But nobody ever mentions the twelfth ingredient: Fear. Chuck Norris uses pepper spray to spice up his steaks Chuck Norris is the only man to ever defeat a brick wall in a game of tennis. Chuck Norris doesn't wash his clothes, he disembowels them, Chuck Norris can win a game of Connect Four in only three moves. Chuck Norris once kicked a can of Pepsi so hard that it turned into Mountain Dew. Chuck Norris can lead a horse to water AND make it drink. Chuck Norris counted to infinity - twice, Remember the Soviet Union? They decided to quit after watching a DeltaForce marathon on Satellite TV."
